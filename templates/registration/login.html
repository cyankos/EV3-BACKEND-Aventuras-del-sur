{% extends 'base_public.html' %}

{% block title %}Ingresar{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Iniciar sesión</h1>

                    {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label" for="id_username">
                                Usuario
                            </label>
                            <input
                                type="text"
                                name="username"
                                id="id_username"
                                value="{{ form.username.value|default_if_none:'' }}"
                                autocomplete="username"
                                autofocus
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="id_password">
                                Contraseña
                            </label>
                            <input
                                type="password"
                                name="password"
                                id="id_password"
                                autocomplete="current-password"
                                class="form-control"
                                required
                            >
                        </div>

                        <input type="hidden" name="next" value="{{ next }}">

                        <button class="btn btn-success w-100" type="submit">
                            Ingresar
                        </button>
                    </form>

                    <hr>

                    <p class="text-center mb-2">¿No tienes una cuenta?</p>

                    <a
                        class="btn btn-outline-success w-100"
                        href="{% url 'registro_turista' %}"
                    >
                        Registrarse como turista
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
