{% extends 'panel/base_panel.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 text-gray-800">Categorías</h1>
  <a class="btn btn-success" href="{% url 'categoria_create' %}">Nueva categoría</a>
</div>
<div class="card shadow"><div class="card-body"><div class="table-responsive">
<table class="table table-bordered datatable">
<thead><tr><th>Nombre</th><th>Descripción</th><th>Activo</th><th>Acciones</th></tr></thead>
<tbody>{% for c in categorias %}
<tr><td>{{ c.nombre }}</td><td>{{ c.descripcion }}</td><td>{{ c.activo|yesno:"Sí,No" }}</td>
<td>
<a class="btn btn-warning btn-sm" href="{% url 'categoria_update' c.pk %}">Editar</a>
<a class="btn btn-danger btn-sm" href="{% url 'categoria_delete' c.pk %}">Eliminar</a>
</td></tr>
{% endfor %}</tbody>
</table></div></div></div>
{% endblock %}
