{% extends 'panel/base_panel.html' %}
{% block title %}Panel Administrador{% endblock %}
{% block content %}
<h1 class="h3 mb-4 text-gray-800">Panel Administrador</h1>
<div class="row">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Usuarios</div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{ usuarios }}</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Categorías</div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{ categorias }}</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-info shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Experiencias</div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{ experiencias }}</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-left-warning shadow h-100 py-2">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Reservas</div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800">{{ reservas }}</div>
                </div>
            </div>
        </div></div>

{% endblock %}
