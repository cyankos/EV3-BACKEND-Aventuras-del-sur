{% extends 'panel/base_panel.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h1 class="h5 m-0 font-weight-bold text-success">Usuario</h1>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success" type="submit">Guardar</button>
          <a class="btn btn-secondary" href="{% url 'usuario_list' %}">Volver</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
